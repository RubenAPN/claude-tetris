<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <label class="theme-switch" title="Tema claro / oscuro">
    <span aria-hidden="true">🌙</span>
    <input type="checkbox" id="theme-toggle" role="switch" aria-label="Modo claro" />
    <span class="slider"></span>
    <span aria-hidden="true">☀️</span>
  </label>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records" class="records-box hidden">
          <form id="name-form" class="name-form hidden">
            <input id="name-input" type="text" maxlength="10" placeholder="Tu nombre" autocomplete="off" aria-label="Nombre" />
            <button type="submit" id="save-name-btn">Guardar</button>
          </form>
          <span class="label">TOP 5</span>
          <ol id="gameover-scores" class="score-list"></ol>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="records-box">
          <span class="label">TOP 5</span>
          <ol id="start-scores" class="score-list"></ol>
          <p class="record-stat">Mejor combo: <b id="start-best-combo">0</b></p>
          <p class="record-stat">Líneas máximas: <b id="start-max-lines">0</b></p>
        </div>
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="link-btn">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
